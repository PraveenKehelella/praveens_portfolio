name: praveen-portfolio

services:
  web:
    build: .
    image: praveen-portfolio:latest
    container_name: praveen-portfolio
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8040}:8000"
    env_file:
      - .env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
